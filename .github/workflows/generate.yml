name: Generate save files

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Clone TTS tools
        run: git clone https://github.com/gavrilikhin-d/tts-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tts-tools/pnpm-lock.yaml

      - name: Install TTS tools deps
        working-directory: tts-tools
        run: pnpm install --frozen-lockfile

      - name: Build TTS tools
        working-directory: tts-tools
        run: pnpm -r --if-present build

      - name: Package Core
        working-directory: mods/core/scripts/objects
        run: node "${{ github.workspace }}/tts-tools/packages/cli/dist/index.js" package . -i . -o Core.json

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mods/core/scripts/objects/Core.json
          generate_release_notes: true
