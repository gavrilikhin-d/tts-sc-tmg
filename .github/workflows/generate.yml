name: Generate save files

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Clone TTS tools
        run: git clone https://github.com/gavrilikhin-d/tts-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tts-tools/pnpm-lock.yaml

      - name: Install TTS tools deps
        working-directory: tts-tools
        run: pnpm install --frozen-lockfile

      - name: Build TTS tools
        working-directory: tts-tools
        run: pnpm -r --if-present build

      - name: Package all mods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mod-json
          for mod_dir in mods/*; do
            [ -d "$mod_dir" ] || continue
            mod_name="$(basename "$mod_dir")"
            input_dir="$mod_dir"
            include_dir="$mod_dir"
            if [ "$mod_name" = "core" ]; then
              input_dir="$mod_dir/scripts/objects"
              include_dir="$input_dir"
            fi
            output_file="artifacts/mod-json/${mod_name}.json"
            echo "Packaging $mod_name from $input_dir -> $output_file"
            node "${{ github.workspace }}/tts-tools/packages/cli/dist/index.js" \
              package "$input_dir" -i "$include_dir" -o "$output_file"
          done

      - name: Zip mod JSON files
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          zip -r mods.zip mod-json

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/mods.zip
          generate_release_notes: true
