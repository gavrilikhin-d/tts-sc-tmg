name: Generate save files

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Clone TTS tools
        run: git clone https://github.com/gavrilikhin-d/tts-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tts-tools/pnpm-lock.yaml

      - name: Install TTS tools deps
        working-directory: tts-tools
        run: pnpm install --frozen-lockfile

      - name: Build TTS tools
        working-directory: tts-tools
        run: pnpm -r --if-present build

      - name: Package all mods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mod-json

          package_one() {
            local package_name="$1"
            local input_dir="$2"
            local include_dir="$3"
            local safe_name
            safe_name="$(echo "$package_name" | sed -E 's/[^A-Za-z0-9._-]+/_/g')"
            local output_file="artifacts/mod-json/${safe_name}.json"
            echo "Packaging ${package_name} from ${input_dir} -> ${output_file}"
            node "${{ github.workspace }}/tts-tools/packages/cli/dist/index.js" \
              package "$input_dir" -i "$include_dir" -o "$output_file"
          }

          for mod_dir in mods/*; do
            [ -d "$mod_dir" ] || continue
            mod_name="$(basename "$mod_dir")"

            if [ "$mod_name" = "core" ]; then
              package_one "$mod_name" "$mod_dir/scripts/objects" "$mod_dir/scripts/objects"
              continue
            fi

            if [ -f "$mod_dir/Data.json" ]; then
              package_one "$mod_name" "$mod_dir" "$mod_dir"
              continue
            fi

            child_count=0
            for child_data in "$mod_dir"/*/Data.json; do
              [ -f "$child_data" ] || continue
              child_dir="$(dirname "$child_data")"
              child_name="$(basename "$child_dir")"
              package_one "${mod_name}__${child_name}" "$child_dir" "$child_dir"
              child_count=$((child_count + 1))
            done

            if [ "$child_count" -eq 0 ]; then
              echo "Skipping $mod_name (no Data.json found at root or immediate children)"
            fi
          done

      - name: Zip mod JSON files
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          zip -r mods.zip mod-json

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/mods.zip
          generate_release_notes: true
